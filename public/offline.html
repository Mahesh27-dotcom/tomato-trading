<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Tomato Trading Manager</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #F7F5F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      max-width: 360px;
      width: 100%;
      text-align: center;
    }
    .icon {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background-color: #C1440E;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
    .icon svg { width: 34px; height: 34px; }
    h1 {
      font-size: 18px;
      font-weight: 600;
      color: #2D2A26;
      margin: 0 0 8px;
    }
    p {
      font-size: 14px;
      color: #6B6459;
      margin: 0 0 24px;
      line-height: 1.5;
    }
    button {
      background-color: #C1440E;
      color: #fff;
      border: none;
      font-size: 14px;
      font-weight: 500;
      padding: 12px 24px;
      border-radius: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M12 8.5c-3.5 0-6.2 2.6-6.2 6.4C5.8 18.4 8.4 21 12 21s6.2-2.6 6.2-6.1c0-3.8-2.7-6.4-6.2-6.4z" fill="white"/>
        <path d="M12 8.5c1-1.6 1-2.9.3-4.2M12 8.5c-1-1.6-1-2.9-.3-4.2M9.3 5.3c.9-.5 1.9-.6 2.7-.3M14.7 5.3c-.9-.5-1.9-.6-2.7-.3" stroke="white" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>Check your internet connection and try again. Your data is safe — nothing was lost.</p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
